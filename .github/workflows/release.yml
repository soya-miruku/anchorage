# Builds and publishes a release, one architecture per machine.
#
# Nothing here cross-compiles. Everything package-desktop.mjs claims about a package it
# establishes by running it — a real window through xvfb, the payload executed, the AppImage
# timed over its own squashfs mount — and none of that is possible for a foreign architecture.
# So x64 builds on an x64 runner and arm64 on an arm64 one, and both get identical verification
# rather than one of them getting an assertion.
#
# What this workflow cannot do, and does not pretend to:
#
#   The design evidence is not regenerated. The comp and the rendered reference are both
#   untracked, and the per-state review is a person looking at two images — that is what the
#   attestation is for, not a gap waiting to be automated. `artifacts/design/design-ledger.json`
#   travels with the commit and package-desktop.mjs validates it against the renderer it just
#   built. Change the renderer without redoing the review locally and the release fails here,
#   which is the gate working as designed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Also create the GitHub release, rather than only building and verifying
        type: boolean
        default: false
      sign:
        # The unsigned path is the one a fork takes, and it is the one nobody exercises — which is
        # how it shipped broken: `SHA256SUMS` named a file the rename step had already renamed, so
        # the publish job's checksum verification exited 1 on every tag push, signed or not. It was
        # found by simulating the pipeline locally, not by running it, because the only way to
        # reach it in CI was to delete a repository secret.
        #
        # A switch that costs nothing when unused is cheaper than a path that can only be tested
        # destructively. It applies to manual runs only: a tag push has no inputs, so a real
        # release signs whenever a key is configured and this cannot quietly turn that off.
        description: Sign when a key is configured. Turn off to exercise the unsigned path.
        type: boolean
        default: true

concurrency:
  # Never two releases of one tag at once, and never cancelled halfway: a half-published release
  # is worse than a late one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      # One architecture failing must not hide whether the other is sound. The publish job
      # requires both, so a partial success still cannot become a release.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            # Needs a public repository or a Team/Enterprise plan. On a private repository
            # without one, this job fails with "no runner matching the labels" — which is a
            # plan question, not a build failure, and is why it says so here.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Both are required by attest-build-provenance and by nothing else here: id-token to get the
      # Sigstore OIDC token, attestations to record the statement against the repository. Granted
      # on this job rather than at the top of the file so the publish job, which handles the
      # release itself, keeps the narrower set it already has.
      id-token: write
      attestations: write
    # The soak alone is thirty minutes, and acceptance drives a real daemon before it.
    timeout-minutes: 120
    steps:
      - name: Refuse a signing configuration that cannot work, before building for forty minutes
        # The same check the signing step makes, made first.
        #
        # Signing is the last substantive step, so a half-configured key is not discovered until
        # everything before it has run: measured twice, 39 and 40 minutes of green work followed by
        # a one-second failure that was knowable at the start. The cost is the operator's time and
        # a runner's, and both are avoidable.
        #
        # Deliberately duplicated rather than shared. A composite action or a reusable script would
        # put the condition somewhere neither step can see, and the failure mode of the two drifting
        # apart is a job that passes this gate and fails the real one — which is exactly what this
        # exists to prevent. Two copies of five lines, with each naming the other, is the cheaper
        # risk; if they ever disagree, the signing step is the one that decides.
        #
        # The unsigned path stays untouched: no key configured is a legitimate build, and only a
        # key *with* a missing passphrase is refused. `secrets` is unavailable to an `if:`
        # expression, so this is a shell check over the step's own env, as it is below.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          # A tag push carries no inputs, so this is true for every real release and the switch
          # cannot quietly unsign one. Only a manual run can turn it off.
          SIGN_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.sign }}
        run: |
          set -euo pipefail
          if [ "${SIGN_REQUESTED:-true}" != "true" ]; then
            echo "Signing turned off for this run; it will exercise the unsigned path."
            exit 0
          fi
          if [ -z "${GPG_PRIVATE_KEY:-}" ] && [ -z "${GPG_KEY_ID:-}" ]; then
            echo "No signing key configured; this build will publish checksums and no signature."
            exit 0
          fi
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "::error title=Signing is half configured::One of GPG_PRIVATE_KEY or GPG_KEY_ID" \
                 "is set and the other is not, so this build would neither sign nor honestly" \
                 "report itself unsigned. Set both, or neither, with" \
                 "node tools/set-release-signing-secrets.mjs"
            exit 1
          fi
          if [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "::error title=GPG_PASSPHRASE is not set::GPG_PRIVATE_KEY is configured but" \
                 "GPG_PASSPHRASE is empty or missing. The exported bundle can only be opened by" \
                 "the passphrase it was exported with; set both together with" \
                 "node tools/set-release-signing-secrets.mjs"
            exit 1
          fi
          echo "Signing key and passphrase are both present; this build will be signed."

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          # package-desktop.mjs shells out to `npm run …` for its source gates, so npm has to be
          # present and pinned rather than left to whatever the runner image ships. Bun stays the
          # runtime the scripts are invoked through; this is only the tool they call.
          node-version: "24"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: core/go.sum

      - name: Install the packaging toolchain
        # rpm supplies both halves of the rpm story: rpmbuild, which fpm shells out to, and
        # rpm2archive, which the payload verification needs because libarchive will not open an
        # rpm. libarchive-tools is bsdtar, for the deb and pacman payloads. xvfb is what makes a
        # real window possible on a headless runner, and libfuse2t64 is what lets the AppImage
        # mount its own squashfs — without it the startup timing has nothing to measure.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            rpm libarchive-tools xvfb x11-utils libfuse2t64

      - name: Let Chromium sandbox itself on this runner
        # Every Electron launch in this job died before it drew anything:
        #   FATAL:setuid_sandbox_host.cc:166 The SUID sandbox helper binary was found, but is
        #   not configured correctly
        # and the host-candidate capture then waited out its full 60s for a renderer that was
        # never coming.
        #
        # Chromium sandboxes a renderer one of two ways. Given unprivileged user namespaces it
        # uses those; denied them it falls back to the setuid helper, which must be root-owned
        # and mode 4755. Ubuntu 24.04 sets apparmor_restrict_unprivileged_userns=1, which closes
        # the first door, and `bun install` cannot chown anything to root, which leaves the
        # second one locked. A developer machine that permits user namespaces never meets this,
        # which is why the build passes locally and failed here.
        #
        # --no-sandbox is not the escape hatch it looks like: assertOSSandboxEnabled refuses to
        # create a window when it sees that flag, deliberately, and the capture exists partly to
        # attest that the renderer really is sandboxed. Turning the sandbox off to make the check
        # pass would leave the check attesting nothing.
        #
        # So the namespace door is reopened rather than the setuid one propped up. It covers all
        # three Electron trees this job runs — node_modules for the capture, release/linux-unpacked
        # for the unpacked smoke, and the AppImage's own extraction — where fixing file modes
        # would have to be repeated for each and cannot reach inside the squashfs at all. It is
        # also the path a user on a normal desktop takes, so CI exercises what ships.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "userns restriction now: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"

      - name: Give the capture an X server to draw into
        # The sandbox fix got Electron as far as trying to open a window, and it died on the
        # next thing: "Missing X server or $DISPLAY". The host-candidate capture spawns Electron
        # directly and expects a display to already exist — package-desktop.mjs wraps its own
        # smoke runs in `xvfb-run`, but nothing wraps the capture, and a developer machine
        # always has a real display so it never came up locally.
        #
        # One long-lived server exported to the whole job, rather than another xvfb-run wrapper:
        # the smokes keep starting their own, which is what their timing budget measures, and
        # anything else in the job that needs a display now simply has one.
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          for _ in $(seq 1 50); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 0.1
          done
          xdpyinfo -display :99 >/dev/null || { echo "Xvfb never came up" >&2; exit 1; }
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "X server ready on :99"

      - name: Confirm the Docker daemon answers
        # The whole core evidence chain talks to a live daemon. Failing here, before an hour of
        # work, says "no daemon" rather than letting acceptance report it as a Docker fault.
        run: |
          docker version
          docker info --format 'server {{.ServerVersion}}, {{.OSType}}/{{.Architecture}}'

      - name: Install renderer dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Give the daemon something to be inspected
        # Two read-only conformance checks need a container that is actually running — native
        # inspect/stats, and streaming a long-lived session — and a fresh runner's daemon is
        # empty. The suite aborts on the first failure, so without this it reported "3 of 4
        # checks executed" and the other 22 never ran at all.
        #
        # The mutation checks create and destroy their own resources; this is only the ambient
        # state the read-only half reads. It stays up for the whole job because
        # package:linux runs read-only acceptance again against the freshly staged core.
        run: |
          set -euo pipefail
          docker pull alpine:3.21
          # Four, because that is the release performance profile's stats fan-out width and its
          # floor — ANCHORAGE_PERF_STATS_FANOUT will not go below 4, since a fan-out measured
          # across fewer containers is not measuring a fan-out. With one the soak failed with
          # "requires 4 running containers".
          for index in 1 2 3 4; do
            docker run -d --name "anchorage-ci-fixture-$index" --restart no \
              alpine:3.21 sleep infinity
          done
          docker volume create anchorage-ci-fixture
          docker network create anchorage-ci-fixture
          docker ps --format '{{.Names}} {{.Status}}'

      - name: Build the core the evidence will be measured against
        # The same flags package-desktop.mjs uses for its staged core, because the evidence and
        # the package must describe one binary: it rebuilds the core itself and compares hashes,
        # so a drift here fails the release with "mutation-tested core hash is stale" rather than
        # shipping evidence about a different binary. A plain `go build` embeds vcs.revision and
        # buildid and would differ on every commit.
        working-directory: core
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" \
            -o bin/anchorage-core ./cmd/anchorage-core
          sha256sum bin/anchorage-core

      - name: Hash the core, so the evidence cache is keyed on what the evidence describes
        id: corehash
        run: echo "sha=$(sha256sum core/bin/anchorage-core | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          # Docker's version belongs in the key because acceptance and the capability ledger
          # measure the core against a daemon: the same binary on a different daemon is a
          # different measurement. The runner image pins it, so this changes when that does.
          key: core-evidence-${{ matrix.arch }}-${{ steps.corehash.outputs.sha }}-${{ hashFiles('.github/workflows/release.yml') }}
          path: |
            artifacts/docker
            artifacts/performance

      - name: Core evidence, regenerated only if it does not describe this core
        # A content-addressed skip rather than an unconditional forty minutes. The evidence set
        # is bound by SHA-256 to one core binary and package:linux refuses a set naming a
        # different one, so reusing it for an unchanged core is the binding doing its job rather
        # than an optimisation that weakens it.
        #
        # On a fresh runner it always regenerates, because there is nothing to reuse — the value
        # is local, and in CI once the cache below is warm for a renderer-only commit.
        run: node tools/ensure-core-evidence.mjs

      - name: Build and verify the ${{ matrix.arch }} packages
        working-directory: app
        run: bun run package:linux

      - name: Checksums, and a signature if a key is configured
        # The *signature* is optional on purpose, and the check is inside the shell rather than
        # in an `if:` expression, because a step's own `env` is not in scope for its own
        # condition — the form that reads correctly silently never runs.
        #
        # Without a key the artifacts are still built and verified, they are simply unsigned,
        # and the release notes say which. Failing a sound build over a missing secret would be
        # the worse trade.
        #
        # The *checksums* are not optional, and this workflow only recently began to mean that
        # sentence. tools/sign-release.mjs is the only thing in the repository that writes
        # SHA256SUMS, so with no key configured no checksum file was produced, and the step that
        # used to follow this one — which renamed it — failed the job with "mv: cannot stat
        # 'SHA256SUMS'" (measured). The unsigned path had therefore never worked; it was latent
        # only because the secrets happen to be set. A release publishes checksums whether or not
        # it can sign them, so the unsigned branch writes them too, and signing is what adds
        # the .asc.
        #
        # --arch is what makes this the release's naming rather than the builder's. Eight
        # installers can share one release; two files called SHA256SUMS cannot, so each
        # architecture's metadata carries its own name. That renaming belongs to the program that
        # writes the checksum list, and there is a lost release behind that sentence: a step here
        # used to rename release-verification.json *after* sign-release.mjs had covered it under
        # its old name, so every SHA256SUMS this workflow ever published ended in a line naming a
        # file the release did not contain, and the verification step in the publish job failed on
        # it every time. One program names the files and lists them, so the two cannot disagree.
        #
        # GPG_PRIVATE_KEY must be a **signing subkey only**, never the primary. Do not set it by
        # hand: `node tools/set-release-signing-secrets.mjs` re-exports it and sets the matching
        # GPG_PASSPHRASE as one operation, after proving locally that the pair signs and that the
        # signature verifies. The two cannot be set independently and be relied on to agree —
        # an exported bundle keeps the passphrase the key held at export time, and a bundle set
        # beside a passphrase from a different day fails here in a way that is indistinguishable
        # from setting no passphrase at all.
        #
        # The subkey itself is made once, by hand, and rotated on the same command:
        #
        #   gpg --quick-add-key <primary-fpr> ed25519 sign 1y
        #
        # What the script then runs, and why each half of it matters — the two are usually
        # conflated:
        #
        #   gpg --armor --export-secret-subkeys <subkey-fpr>!
        #                ^^^^^^^^^^^^^^^^^^^^^^             ^
        #                keeps the PRIMARY out              keeps every OTHER subkey out
        #
        # --export-secret-subkeys never exports the primary's secret, with or without the bang;
        # --export-secret-keys is the command that would. What the "!" prevents is shipping the
        # rest of the key — for this key, the encryption subkey, which would let a compromised
        # runner decrypt everything ever encrypted to you. Measured on gpg 2.4.7: with the bang,
        # one secret in the bundle; without it, two.
        #
        # The exported bundle carries a stub primary with no secret — `gpg -K` shows it as
        # `sec#` — so a compromised runner can sign and cannot certify other keys as you. If it
        # ever is compromised, revoke the subkey; the release identity and every signature made
        # before it survive. The primary stays on your machine and never reaches CI.
        #
        # GPG_KEY_ID is still the **primary** fingerprint. sign-release.mjs resolves the
        # identity from it and lets gpg pick the signing subkey, then checks the signature's
        # primary key rather than the key that signed — which is what makes the subkey layout
        # work at all.
        env:
          ARCH: ${{ matrix.arch }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          # A tag push carries no inputs, so this is true for every real release and the switch
          # cannot quietly unsign one. Only a manual run can turn it off.
          SIGN_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.sign }}
        working-directory: app
        run: |
          set -euo pipefail
          if [ "${SIGN_REQUESTED:-true}" != "true" ]; then
            echo "Signing turned off for this run; publishing checksums and leaving it unsigned."
            bun run release:checksums -- --arch "$ARCH"
            ls -la release
            exit 0
          fi
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "No signing key configured; publishing checksums and leaving this build unsigned."
            bun run release:checksums -- --arch "$ARCH"
            ls -la release
            exit 0
          fi

          # tools/sign-release.mjs takes no passphrase and relies on gpg-agent for it, which is
          # the right shape for a human at a terminal and needs the agent primed here instead.
          # A preset passphrase does that without the signer learning about CI.
          #
          # Nothing is written to gpg.conf, and in particular not `pinentry-mode loopback`. It
          # was there to go with the preset, and as a global option it applied to every gpg call
          # in this job, --verify included — which is not a decision signing gets to make for
          # verification. Removing it was right and was not sufficient: its presence hid a
          # signing failure behind an empty signature file, and its absence turned the same
          # failure into "Inappropriate ioctl for device", which the script's error branch read
          # as "you need an interactive terminal, run this yourself" — advice for a laptop,
          # printed in a CI log. sign-release.mjs now passes loopback on the one call that
          # signs, and only when that run has no terminal, so a runner fails deterministically
          # and says why, gpg-agent is never asked to find a pinentry it should not find, and
          # verification is untouched by either.
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          echo "allow-preset-passphrase" >> "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          gpgconf --launch gpg-agent
          # A preset that reaches a different agent than the one gpg asks produces a log
          # byte-identical to a preset that reached the wrong key. Naming the home and the
          # socket directory once costs nothing and tells those two apart.
          echo "gnupg home: $(gpgconf --list-dirs homedir)"
          echo "agent sockets: $(gpgconf --list-dirs socketdir)"

          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # A signing key with no passphrase is not a configuration this workflow supports, and
          # saying so here is the difference between two failures that are otherwise identical.
          #
          # This was `if [ -n "${GPG_PASSPHRASE:-}" ]`, which reads as a reasonable option check
          # and is in fact a silent skip. GPG_PASSPHRASE has never been set on this repository, so
          # the preset below never ran, nothing was cached, and signing died with "Sorry, we are
          # in batchmode - can't get input" — run 31490921788. Measured in a container shaped
          # like this job, a *wrong* passphrase produces that same single line, the same exit 2
          # and the same zero-byte signature; the keyinfo line below separates "a preset happened"
          # from "none did", and nothing on this path separates a right preset from a wrong one,
          # because gpg-preset-passphrase caches whatever it is handed and exits 0. That is how
          # three runs went on the same failure wearing two faces. A missing secret must therefore
          # stop the job here, by name, rather than become an unsigned path nobody asked for.
          #
          # An echoed ::error:: rather than `${GPG_PASSPHRASE:?…}`: the runner parses workflow
          # commands from a step's stdout, and the shell's own unset-parameter message goes to
          # stderr, so the annotation would not reliably appear in the job summary.
          #
          # The `secrets` context is not available in an `if:` expression — the availability
          # table lists github, needs, strategy, matrix, job, runner, env, vars, steps and inputs
          # for a step condition, and no secrets — so this check belongs in the shell, mapped
          # through the step's env above.
          if [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "::error title=GPG_PASSPHRASE is not set::GPG_PRIVATE_KEY is configured but" \
                 "GPG_PASSPHRASE is empty or missing. The exported bundle can only be opened by" \
                 "the passphrase it was exported with; set both together with" \
                 "node tools/set-release-signing-secrets.mjs"
            exit 1
          fi
          # Every keygrip the bundle carries, not the first one.
          #
          # `gpg -K` prints the primary's keygrip before its subkeys', so stopping at the
          # first line always primed the *primary* — which for a signing-subkey-only export
          # is the `sec#` stub whose secret never left the operator's machine. Presetting a
          # grip that holds no key is not an error to gpg-preset-passphrase; it exits 0 and
          # caches nothing. Signing then asked the agent for the *subkey's* grip, missed,
          # and had no passphrase and no way to ask for one.
          #
          # This is the line that failed run 31428897746. Nothing was ever signed; the
          # verification error afterwards was an accurate report about an empty file.
          #
          # Presetting all of them is right rather than merely sufficient: which subkey gpg
          # chooses to sign with is gpg's decision, and it may add a second signing subkey to
          # the layout at any rotation. A grip whose secret stayed behind is a no-op, which
          # is exactly what should happen to the primary here.
          keygrips=$(gpg --batch --with-keygrip --list-secret-keys "$GPG_KEY_ID" \
            | awk '/Keygrip/ { print $3 }')
          if [ -z "$keygrips" ]; then
            echo "Imported no secret key matching $GPG_KEY_ID" >&2
            exit 1
          fi
          # Three confirmations, none of which is a secret: a keygrip is a hash of public key
          # parameters and a filename is a filename. They cost nothing and they distinguish
          # the failure modes that otherwise share a log.
          #
          # Two grips for the documented key shape, the stub primary and the signing subkey,
          # and exactly one file in private-keys-v1.d — the *second* grip's — because the
          # primary's secret never left the operator's machine. That asymmetry is the whole
          # reason presetting only the first grip cached nothing.
          echo "keygrips carried by $GPG_KEY_ID (expect 2):"
          printf '  %s\n' $keygrips
          echo "secret key files on this runner (expect one, matching the second grip):"
          ls -1 "$HOME/.gnupg/private-keys-v1.d/" || true
          preset=$(gpgconf --list-dirs libexecdir)/gpg-preset-passphrase
          for keygrip in $keygrips; do
            printf '%s' "$GPG_PASSPHRASE" | "$preset" --preset "$keygrip"
          done
          # And which grips the agent will now answer for without asking anyone: the column
          # after the three dashes is 1 when a passphrase is cached. gpg-preset-passphrase
          # exits 0 for a grip it cannot find, so this is the only cheap evidence that the
          # preset reached the key that signs — and it is evidence about the same agent gpg
          # will talk to, which no amount of grip-counting can be.
          gpg-connect-agent 'keyinfo --list' /bye

          # Signing, and then both facts about it before anything downstream assumes either.
          # The release that prompted all this printed "Signed with ***" over a 0-byte file.
          set +e
          bun run release:sign -- --key "$GPG_KEY_ID" --arch "$ARCH"
          sign_status=$?
          set -e
          echo "release:sign exited $sign_status"
          # The published names, because those are the only ones that exist: nothing renames the
          # signature after it is made, so the .asc keeps the name its signature was made over by
          # construction rather than by a rule a later step has to remember.
          ls -l "release/SHA256SUMS-$ARCH" "release/SHA256SUMS-$ARCH.asc" || true
          ls -la release
          exit "$sign_status"

      - name: Remove the fixture
        # `always()` so a failed build still leaves the daemon as it was found. The runner is
        # discarded either way, but a job that only cleans up on success teaches the wrong habit
        # and would matter the moment this runs anywhere persistent.
        if: always()
        run: |
          for index in 1 2 3 4; do
            docker rm -f "anchorage-ci-fixture-$index" || true
          done
          docker volume rm -f anchorage-ci-fixture || true
          docker network rm anchorage-ci-fixture || true

      - name: Attest that these installers came from this workflow and this commit
        # Provenance the downloader can check without holding a key of ours.
        #
        # A detached signature says "someone with this key signed this". That is worth having, and
        # it is what the .asc beside the checksums is for — but it depends on a long-lived private
        # key, and on the downloader finding the right public half and knowing to compare its
        # fingerprint. Every one of those steps is a place to be fooled or to give up.
        #
        # An attestation says something different and, for a downloader, usually more useful: this
        # exact file was produced by this workflow, from this commit, on GitHub's runners. It is a
        # signed SLSA provenance statement, keyless via Sigstore, and it is checked with
        #
        #     gh attestation verify <file> --repo soya-miruku/anchorage
        #
        # The two are complements rather than alternatives, and their weaknesses are opposite: the
        # signature is verifiable offline and independent of GitHub, and survives GitHub being
        # wrong; the attestation cannot be forged by anyone who steals the signing key, and cannot
        # be forgotten by a maintainer who loses a passphrase. Both are published.
        #
        # The installers only. The checksum list is covered by its own signature, and attesting a
        # file that names the others would say nothing the digests do not already say.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.rpm
            app/release/*.pacman

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          if-no-files-found: error
          # The unpacked tree is an intermediate the size of the installers again; only what a
          # downloader receives is worth carrying between jobs.
          path: |
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.rpm
            app/release/*.pacman
            app/release/SHA256SUMS*
            app/release/release-verification*
            app/release/release-signature*

  publish:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      # The only job that writes anything, and the only one that needs to.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Report what is about to be published
        run: |
          ls -la artifacts
          for sums in artifacts/SHA256SUMS-*; do
            [ -f "$sums" ] || continue
            # The same exclusion as the step below, for the same reason: SHA256SUMS-<arch>.asc
            # matches this glob and is an armoured signature rather than a list of checksums.
            # Printing one under a checksums header is merely noise, where feeding one to
            # `sha256sum -c` below is a failed publish — but two loops reading the same glob
            # should agree about what it can match.
            case "$sums" in *.asc) continue ;; esac
            echo "--- $sums ---"
            cat "$sums"
          done

      - name: Verify every checksum against the file beside it
        # The checksums were computed on the machine that built each package; this confirms the
        # bytes survived the journey through two artifact uploads intact. A release whose own
        # checksum file does not match its own artifacts is worse than no release.
        working-directory: artifacts
        run: |
          for sums in SHA256SUMS-*; do
            [ -f "$sums" ] || continue
            # SHA256SUMS-<arch>.asc matches this glob and is not a list of checksums. Feeding it
            # to `sha256sum -c` is "no properly formatted checksum lines found", a non-zero exit,
            # and — since a step runs under `bash -e` — a failed publish. Measured: this step
            # passes for an unsigned release and fails for a signed one, which is the wrong way
            # round for a step whose purpose is to protect a signed release.
            case "$sums" in *.asc) continue ;; esac
            echo "checking $sums"
            sha256sum -c "$sums"
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.sha) }}
        run: |
          # What the notes may say about signing is what this runner can establish, which is which
          # architectures shipped a signature file — not that any of them verifies.
          #
          # "Artifacts are **signed**" was inferred from `ls artifacts/SHA256SUMS-*.asc` matching
          # anything at all, which is a file's existence standing in for a verification: the same
          # inference that printed "Signed with <fingerprint>" over a 0-byte file one layer down.
          # It is *now* largely sound, because sign-release.mjs deletes an empty or unverified .asc
          # before exiting non-zero and the build step fails with it — so an .asc that reached this
          # job did verify. On the builder, two artifact uploads ago, against a keyring this runner
          # does not have.
          #
          # It is also one adjective over a set of independent per-architecture signatures, read as
          # a claim about every file in the release. That set cannot be partial today, because
          # `needs: build` skips this job unless every matrix leg succeeded and a leg that could
          # not sign exits non-zero — but the sentence should not need that argument somewhere else
          # in this file to be true. So the notes name what was published, per architecture, and
          # leave verifying it to the person who has a reason to: theirs is the check that matters,
          # because it runs against the bytes they actually downloaded.
          signed=
          for asc in artifacts/SHA256SUMS-*.asc; do
            [ -f "$asc" ] || continue
            arch=${asc##*/SHA256SUMS-}
            signed="$signed ${arch%.asc}"
          done
          {
            echo "Linux packages for x64 and arm64, each built and verified on its own"
            echo "architecture. Nothing here is cross-compiled: the AppImage payload is"
            echo "executed and timed on the machine that produced it, and the deb, rpm and"
            echo "pacman payloads are unpacked and checked byte-for-byte against it."
            echo
            if [ -n "$signed" ]; then
              echo "A detached OpenPGP signature is published for:$signed. It verified on the"
              echo "machine that made it; nothing has re-checked it since, so check it yourself:"
              echo
              echo "    gpg --import anchorage-signing-key.asc   # from the repository"
              echo "    gpg --verify SHA256SUMS-<arch>.asc SHA256SUMS-<arch>"
              echo
              # The import is what makes the check mean anything, and these notes are read by
              # exactly the person who has no keyring yet. Without it `gpg --verify` exits 2 on
              # an empty keyring, and prints `Good signature` for whatever key a reader does
              # happen to hold — answering "signed by someone" where the reader needs "signed by
              # Anchorage". Naming the primary fingerprint gives the check something to anchor to.
              echo "Signing lives on a subkey, so gpg names a different key as the signer and"
              echo "this one as its primary. That is the expected shape — confirm it reads:"
              echo
              echo "    6EC9 EBF7 5C48 EA12 D1C5  4A7E 22E6 9E9D C856 20D3"
            else
              echo "No signature is published for this release: it was built without a signing"
              echo "key. The checksum lists still cover every artifact."
            fi
            echo
            echo "\`release-verification-*.json\` records what was executed and what was only"
            echo "inspected, per artifact. Verify a download against its own architecture's"
            echo "\`SHA256SUMS-<arch>\` before installing it."
          } > notes.md
          gh release create "$TAG" \
            --title "Anchorage $TAG" \
            --notes-file notes.md \
            --draft \
            artifacts/*
