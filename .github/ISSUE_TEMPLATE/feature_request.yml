name: Feature request
description: Something Anchorage should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Worth reading first: the README's **What it deliberately does not do**. Several features
        were removed rather than faked — Kubernetes, Ask Gordon, Sandboxes, Extensions, Dev
        Environments and others — each because it cannot work honestly against a plain Linux
        Docker Engine. If your request is one of those, the interesting question is not "can we
        add it" but "what changed that makes it possible now" — please answer that below.

  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: >-
        The task, not the feature. "I need to see which container is eating my disk" tells us more
        than "add a disk column", and often has a better answer than the one you had in mind.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The `docker` command or workflow you use now, if there is one.
    validations:
      required: false

  - type: textarea
    id: source
    attributes:
      label: Where the answer would come from
      description: >-
        This is the question that decides most requests. Anchorage only shows what it can establish
        — from the Engine API, or from a CLI plugin that is actually installed. If the data lives
        in a web console, a subscription service, or Docker Desktop, it cannot be shown here
        honestly, and a screen that displayed it anyway would be the one thing this project refuses
        to do.

        If you know the API endpoint or the command that produces it, naming it here makes the
        request much easier to act on.
    validations:
      required: false
