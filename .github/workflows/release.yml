# Builds and publishes a release, one architecture per machine.
#
# Nothing here cross-compiles. Everything package-desktop.mjs claims about a package it
# establishes by running it — a real window through xvfb, the payload executed, the AppImage
# timed over its own squashfs mount — and none of that is possible for a foreign architecture.
# So x64 builds on an x64 runner and arm64 on an arm64 one, and both get identical verification
# rather than one of them getting an assertion.
#
# What this workflow cannot do, and does not pretend to:
#
#   The design evidence is not regenerated. The comp and the rendered reference are both
#   untracked, and the per-state review is a person looking at two images — that is what the
#   attestation is for, not a gap waiting to be automated. `artifacts/design/design-ledger.json`
#   travels with the commit and package-desktop.mjs validates it against the renderer it just
#   built. Change the renderer without redoing the review locally and the release fails here,
#   which is the gate working as designed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Also create the GitHub release, rather than only building and verifying
        type: boolean
        default: false

concurrency:
  # Never two releases of one tag at once, and never cancelled halfway: a half-published release
  # is worse than a late one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      # One architecture failing must not hide whether the other is sound. The publish job
      # requires both, so a partial success still cannot become a release.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            # Needs a public repository or a Team/Enterprise plan. On a private repository
            # without one, this job fails with "no runner matching the labels" — which is a
            # plan question, not a build failure, and is why it says so here.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The soak alone is thirty minutes, and acceptance drives a real daemon before it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          # package-desktop.mjs shells out to `npm run …` for its source gates, so npm has to be
          # present and pinned rather than left to whatever the runner image ships. Bun stays the
          # runtime the scripts are invoked through; this is only the tool they call.
          node-version: "24"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: core/go.sum

      - name: Install the packaging toolchain
        # rpm supplies both halves of the rpm story: rpmbuild, which fpm shells out to, and
        # rpm2archive, which the payload verification needs because libarchive will not open an
        # rpm. libarchive-tools is bsdtar, for the deb and pacman payloads. xvfb is what makes a
        # real window possible on a headless runner, and libfuse2t64 is what lets the AppImage
        # mount its own squashfs — without it the startup timing has nothing to measure.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            rpm libarchive-tools xvfb libfuse2t64

      - name: Confirm the Docker daemon answers
        # The whole core evidence chain talks to a live daemon. Failing here, before an hour of
        # work, says "no daemon" rather than letting acceptance report it as a Docker fault.
        run: |
          docker version
          docker info --format 'server {{.ServerVersion}}, {{.OSType}}/{{.Architecture}}'

      - name: Install renderer dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Give the daemon something to be inspected
        # Two read-only conformance checks need a container that is actually running — native
        # inspect/stats, and streaming a long-lived session — and a fresh runner's daemon is
        # empty. The suite aborts on the first failure, so without this it reported "3 of 4
        # checks executed" and the other 22 never ran at all.
        #
        # The mutation checks create and destroy their own resources; this is only the ambient
        # state the read-only half reads. It stays up for the whole job because
        # package:linux runs read-only acceptance again against the freshly staged core.
        run: |
          set -euo pipefail
          docker pull alpine:3.21
          # Four, because that is the release performance profile's stats fan-out width and its
          # floor — ANCHORAGE_PERF_STATS_FANOUT will not go below 4, since a fan-out measured
          # across fewer containers is not measuring a fan-out. With one the soak failed with
          # "requires 4 running containers".
          for index in 1 2 3 4; do
            docker run -d --name "anchorage-ci-fixture-$index" --restart no \
              alpine:3.21 sleep infinity
          done
          docker volume create anchorage-ci-fixture
          docker network create anchorage-ci-fixture
          docker ps --format '{{.Names}} {{.Status}}'

      - name: Build the core the evidence will be measured against
        # The same flags package-desktop.mjs uses for its staged core, because the evidence and
        # the package must describe one binary: it rebuilds the core itself and compares hashes,
        # so a drift here fails the release with "mutation-tested core hash is stale" rather than
        # shipping evidence about a different binary. A plain `go build` embeds vcs.revision and
        # buildid and would differ on every commit.
        working-directory: core
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" \
            -o bin/anchorage-core ./cmd/anchorage-core
          sha256sum bin/anchorage-core

      - name: Hash the core, so the evidence cache is keyed on what the evidence describes
        id: corehash
        run: echo "sha=$(sha256sum core/bin/anchorage-core | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          # Docker's version belongs in the key because acceptance and the capability ledger
          # measure the core against a daemon: the same binary on a different daemon is a
          # different measurement. The runner image pins it, so this changes when that does.
          key: core-evidence-${{ matrix.arch }}-${{ steps.corehash.outputs.sha }}-${{ hashFiles('.github/workflows/release.yml') }}
          path: |
            artifacts/docker
            artifacts/performance

      - name: Core evidence, regenerated only if it does not describe this core
        # A content-addressed skip rather than an unconditional forty minutes. The evidence set
        # is bound by SHA-256 to one core binary and package:linux refuses a set naming a
        # different one, so reusing it for an unchanged core is the binding doing its job rather
        # than an optimisation that weakens it.
        #
        # On a fresh runner it always regenerates, because there is nothing to reuse — the value
        # is local, and in CI once the cache below is warm for a renderer-only commit.
        run: node tools/ensure-core-evidence.mjs

      - name: Build and verify the ${{ matrix.arch }} packages
        working-directory: app
        run: bun run package:linux

      - name: Sign
        # Optional on purpose, and the check is inside the shell rather than in an `if:`
        # expression, because a step's own `env` is not in scope for its own condition — the
        # form that reads correctly silently never runs.
        #
        # Without a key the artifacts are still built and verified, they are simply unsigned,
        # and the release notes say which. Failing a sound build over a missing secret would be
        # the worse trade.
        #
        # GPG_PRIVATE_KEY must be a **signing subkey only**, never the primary:
        #
        #   gpg --quick-add-key <primary-fpr> ed25519 sign 1y
        #   gpg --armor --export-secret-subkeys <subkey-fpr>!    # the ! matters
        #
        # The exported bundle carries a stub primary with no secret — `gpg -K` shows it as
        # `sec#` — so a compromised runner can sign and cannot certify other keys as you. If it
        # ever is compromised, revoke the subkey; the release identity and every signature made
        # before it survive. The primary stays on your machine and never reaches CI.
        #
        # GPG_KEY_ID is still the **primary** fingerprint. sign-release.mjs resolves the
        # identity from it and lets gpg pick the signing subkey, then checks the signature's
        # primary key rather than the key that signed — which is what makes the subkey layout
        # work at all.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        working-directory: app
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_KEY_ID:-}" ]; then
            echo "No signing key configured; leaving this build unsigned."
            exit 0
          fi

          # tools/sign-release.mjs takes no passphrase and relies on gpg-agent for it, which is
          # the right shape for a human at a terminal and needs the agent primed here instead.
          # Loopback plus a preset passphrase does that without the signer learning about CI.
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          {
            echo "allow-loopback-pinentry"
            echo "allow-preset-passphrase"
          } >> "$HOME/.gnupg/gpg-agent.conf"
          echo "pinentry-mode loopback" >> "$HOME/.gnupg/gpg.conf"
          gpgconf --kill gpg-agent || true
          gpgconf --launch gpg-agent

          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            keygrip=$(gpg --batch --with-keygrip --list-secret-keys "$GPG_KEY_ID" \
              | awk '/Keygrip/ { print $3; exit }')
            if [ -z "$keygrip" ]; then
              echo "Imported no secret key matching $GPG_KEY_ID" >&2
              exit 1
            fi
            preset=$(gpgconf --list-dirs libexecdir)/gpg-preset-passphrase
            printf '%s' "$GPG_PASSPHRASE" | "$preset" --preset "$keygrip"
          fi

          bun run release:sign -- --key "$GPG_KEY_ID"

      - name: Name the metadata for its own architecture
        # Eight installers can share one release; two files called SHA256SUMS cannot. Each
        # architecture keeps its own list, which is also the more honest arrangement: a checksum
        # file signed by a machine should cover what that machine actually built.
        #
        # Spelled out per file rather than derived from the name. The installers already carry
        # their architecture and are left alone; only these four collide.
        env:
          ARCH: ${{ matrix.arch }}
        working-directory: app/release
        run: |
          set -euo pipefail
          mv SHA256SUMS "SHA256SUMS-$ARCH"
          mv release-verification.json "release-verification-$ARCH.json"
          # Both exist only when the build was signed, and the checksum file must keep the name
          # its signature was made over — so the .asc follows the file, not a pattern.
          #
          # if-blocks rather than `[ -f x ] && mv`: under `set -e` a false test is a non-zero
          # command at the end of a script, so the unsigned path would fail the step.
          if [ -f SHA256SUMS.asc ]; then
            mv SHA256SUMS.asc "SHA256SUMS-$ARCH.asc"
          fi
          if [ -f release-signature.json ]; then
            mv release-signature.json "release-signature-$ARCH.json"
          fi
          ls -la

      - name: Remove the fixture
        # `always()` so a failed build still leaves the daemon as it was found. The runner is
        # discarded either way, but a job that only cleans up on success teaches the wrong habit
        # and would matter the moment this runs anywhere persistent.
        if: always()
        run: |
          for index in 1 2 3 4; do
            docker rm -f "anchorage-ci-fixture-$index" || true
          done
          docker volume rm -f anchorage-ci-fixture || true
          docker network rm anchorage-ci-fixture || true

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          if-no-files-found: error
          # The unpacked tree is an intermediate the size of the installers again; only what a
          # downloader receives is worth carrying between jobs.
          path: |
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.rpm
            app/release/*.pacman
            app/release/SHA256SUMS*
            app/release/release-verification*
            app/release/release-signature*

  publish:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      # The only job that writes anything, and the only one that needs to.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Report what is about to be published
        run: |
          ls -la artifacts
          for sums in artifacts/SHA256SUMS-*; do
            [ -f "$sums" ] || continue
            echo "--- $sums ---"
            cat "$sums"
          done

      - name: Verify every checksum against the file beside it
        # The checksums were computed on the machine that built each package; this confirms the
        # bytes survived the journey through two artifact uploads intact. A release whose own
        # checksum file does not match its own artifacts is worse than no release.
        working-directory: artifacts
        run: |
          for sums in SHA256SUMS-*; do
            [ -f "$sums" ] || continue
            echo "checking $sums"
            sha256sum -c "$sums"
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.sha) }}
        run: |
          signed=unsigned
          if ls artifacts/SHA256SUMS-*.asc >/dev/null 2>&1; then
            signed=signed
          fi
          {
            echo "Linux packages for x64 and arm64, each built and verified on its own"
            echo "architecture. Nothing here is cross-compiled: the AppImage payload is"
            echo "executed and timed on the machine that produced it, and the deb, rpm and"
            echo "pacman payloads are unpacked and checked byte-for-byte against it."
            echo
            echo "Artifacts are **$signed**."
            echo
            echo "\`release-verification-*.json\` records what was executed and what was only"
            echo "inspected, per artifact. Verify a download against its own architecture's"
            echo "\`SHA256SUMS-<arch>\` before installing it."
          } > notes.md
          gh release create "$TAG" \
            --title "Anchorage $TAG" \
            --notes-file notes.md \
            --draft \
            artifacts/*
