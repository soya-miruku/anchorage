appId: io.anchorage.desktop
productName: Anchorage
electronVersion: 43.2.0
asar: true
# gzip, not xz. `maximum` builds the AppImage's squashfs with xz at 1 MB blocks, and Electron
# demand-pages a 220 MB binary: every fault into an uncached region costs a whole 1 MB xz block
# decompressed through squashfuse, on every launch, because the mount is fresh each time.
# Measured on this machine, same commit, headless smoke: xz 57.8 s, gzip 7.4 s, and the plain
# unpacked build 7.4 s — so with gzip the squashfs layer costs nothing at all and xz was the
# entire 50 s. The price is size: 93.6 MB -> 119.2 MB. Do not raise this without re-measuring
# `test:appimage-startup`, which exists because of this.
compression: normal
npmRebuild: false

directories:
  buildResources: build
  output: release

files:
  - package.json
  - electron/**/*.mjs
  - electron/preload.cjs
  - "!electron/**/*.test.mjs"
  - dist/client/**/*
  - "!**/*.map"

extraResources:
  - from: build/core
    to: core
    filter:
      - anchorage-core
      - manifest.json

electronLanguages:
  - en-GB
  - en-US

linux:
  target:
    - target: AppImage
      arch:
        - x64
    # The three native formats, all produced by electron-builder's bundled fpm, so none of
    # them needs dpkg, rpmbuild or makepkg installed. They carry the same staged core and
    # renderer as the AppImage and are verified alongside it rather than merely emitted:
    # verifyInstallers unpacks each one and checks the core and the asar inside it.
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: pacman
      arch:
        - x64
  # deb and rpm record a homepage in their metadata. It is read from package.json rather than
  # from here — FpmTarget takes `info.metadata.homepage` and refuses to build without it, which
  # is what the note that used to sit here was describing. The URL is the project's own, so it
  # is neither invented nor unrelated; it is a private repository today, so it will 404 for
  # anyone without access, which makes it unreachable rather than incorrect.
  category: Development
  icon: build/icon.png
  executableName: anchorage
  syncDesktopName: true
  synopsis: A fast desktop interface for Docker Engine and the installed Docker CLI.
  description: >-
    Anchorage is a performant desktop interface for inspecting and operating
    Docker through a capability-aware native core and the installed Docker CLI.
  maintainer: Anchorage Contributors
  vendor: Anchorage Contributors
  desktop:
    entry:
      Name: Anchorage
      GenericName: Docker Container Manager
      Comment: Inspect and operate Docker from a native desktop interface
      Categories: Development;System;
      Keywords: Docker;Container;Image;Volume;Build;Compose;
      StartupWMClass: anchorage
      X-GNOME-UsesNotifications: "false"

appImage:
  # Keeps the Chromium OS sandbox on for desktop-integrated launches.
  #
  # AppImageTarget computes the desktop Exec as `AppRun <executableArgs> %U`, and when no
  # appimage toolset is configured its default executableArgs is ["--no-sandbox"] — which
  # disables the seccomp-bpf/namespace sandbox. That is a different control from
  # webPreferences.sandbox and must stay enabled; main.mjs asserts at startup that the flag
  # is absent, so a regression here fails the app rather than silently weakening it.
  #
  # An empty list is not the same as omitting this key: the default is applied with `??`,
  # which falls back only on null/undefined, so [] is what actually suppresses the flag.
  # This replaced a `linux.desktop.entry.Exec` override, which current electron-builder
  # rejects outright in favour of executableArgs.
  executableArgs: []

artifactName: Anchorage-${version}-${arch}.${ext}
